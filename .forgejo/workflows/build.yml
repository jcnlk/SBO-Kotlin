name: Build

on:
  push:
    branches:
      - "main"
    paths: &build-paths
      - ".forgejo/workflows/build.yml"
      - "event-processor/**"
      - "gradle/**"
      - "src/**"
      - "versions/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "root.gradle.kts"
      - "settings.gradle.kts"
  pull_request:
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: build-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: "27"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ forgejo.event_name != 'push' }}

      - name: Build Mod
        run: ./gradlew build --build-cache --stacktrace
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Upload Build Artifacts
        if: ${{ !cancelled() && (forgejo.event_name != 'pull_request' || failure()) }}
        uses: forgejo/upload-artifact@v4
        with:
          name: sbo-build-artifacts
          path: build/versions/SBO-*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
