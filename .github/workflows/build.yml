name: Build

on:
  push:
    branches:
      - main
    paths: &build-paths
      - ".github/workflows/build.yml"
      - "event-processor/**"
      - "gradle/**"
      - "src/**"
      - "versions/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "root.gradle.kts"
      - "settings.gradle.kts"
  pull_request:
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: Set Up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: "27"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Build Mod
        run: ./gradlew build --build-cache --stacktrace

      - name: Upload 26.1.2 JAR
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || failure()) }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbo-26.1.2-fabric
          path: build/versions/SBO-*+26.1.2-fabric.jar
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Upload 26.2 JAR
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || failure()) }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbo-26.2-fabric
          path: build/versions/SBO-*+26.2-fabric.jar
          archive: false
          if-no-files-found: error
          retention-days: 90
